apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev-my-microservices-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/VictorGhosh/my-microservices-demo.git
    targetRevision: dev
    path: overlay/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev
