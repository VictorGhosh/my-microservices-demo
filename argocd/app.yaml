apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-microservices-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/VictorGhosh/my-microservices-demo.git
    targetRevision: main
    path: overlay/prod
  
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
