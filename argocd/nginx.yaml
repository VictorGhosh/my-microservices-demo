apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-gateway-fabric-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/VictorGhosh/my-microservices-demo.git
    targetRevision: dev
    path: nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway-fabric

