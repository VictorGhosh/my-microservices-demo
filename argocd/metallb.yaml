apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: metallb
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/VictorGhosh/my-microservices-demo.git
    targetRevision: dev
    path: metallb

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
