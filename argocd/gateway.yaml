apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-gateway-fabric-gateway
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/VictorGhosh/my-microservices-demo.git
    targetRevision: main
    path: gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: ngf-system

