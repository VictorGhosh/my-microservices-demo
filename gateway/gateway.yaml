apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: boutique

spec:
  gatewayClassName: nginx
  listeners: 
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - dev
                  - prod
